# Every gate that does not need the benchmark phone (TRD 3, Testing): the Zig
# unit tests, the facade and d3-force suites, the 50-seed parity corpus, the
# fast error corpus, and the thread and failover suites on x86-64 Linux.
name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:zig
      - run: npm test
      - run: npm run test:fast
      - run: PARITY_SEEDS=50 npm run test:parity
      - run: THREADS_TICKS=300 npm run test:threads
